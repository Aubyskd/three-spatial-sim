[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gis-converter"
version = "0.4.0"
description = "Reproducible GeoTIFF DEM to terrain package pipeline"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "rasterio>=1.3", "pyproj>=3.6", "trimesh>=4.0"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["gis_converter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
